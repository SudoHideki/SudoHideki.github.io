<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポモドーロタイマー</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06152d;
      --panel: #0b2142;
      --panel-2: #102d56;
      --line: #5bc7ff;
      --text: #f4fdff;
      --muted: #b9d7e8;
      --accent: #1fc7a1;
      --blue: #5bc7ff;
      --purple: #8c7ae6;
      --danger: #ff6b8a;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 8%, rgba(91, 199, 255, 0.24), transparent 28rem),
        radial-gradient(circle at 10% 20%, rgba(140, 122, 230, 0.24), transparent 18rem),
        var(--bg);
      color: var(--text);
      font-family: "Meiryo", "Yu Gothic", system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .app {
      width: min(940px, 100%);
      background: rgba(11, 33, 66, 0.94);
      border: 1px solid rgba(91, 199, 255, 0.78);
      border-radius: 28px;
      box-shadow: 0 22px 70px var(--shadow);
      padding: clamp(18px, 4vw, 30px);
    }

    .row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 10px 0;
    }

    .panel {
      background: var(--panel-2);
      border-radius: 18px;
      padding: 8px 10px;
    }

    label {
      color: #dff7ff;
      font-size: 14px;
    }

    input,
    select {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #06152d;
      color: #fff;
      font: inherit;
      padding: 0 10px;
    }

    input[type="number"] {
      width: 78px;
    }

    input[list] {
      width: min(370px, 80vw);
    }

    button {
      min-width: 86px;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: #1b78a8;
      color: #fff;
      font: 700 14px "Meiryo", "Yu Gothic", system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    }

    button:hover {
      filter: brightness(1.13);
    }

    .icon-button {
      min-width: 72px;
      height: 54px;
      font-size: 28px;
      line-height: 1;
    }

    .start {
      background: var(--accent);
      color: #06152d;
    }

    .pause {
      background: var(--blue);
      color: #06152d;
    }

    .reset {
      background: var(--purple);
    }

    .export {
      background: var(--purple);
    }

    .mode {
      min-height: 46px;
      margin: 18px 0 4px;
      text-align: center;
      font-size: clamp(26px, 6vw, 34px);
      font-weight: 700;
    }

    .moon-wrap {
      display: grid;
      place-items: center;
      margin: 2px 0;
    }

    svg {
      width: 190px;
      max-width: 48vw;
      height: auto;
      overflow: visible;
    }

    .time {
      text-align: center;
      font-size: clamp(54px, 14vw, 76px);
      font-weight: 800;
      line-height: 1.08;
      margin: 2px 0;
      letter-spacing: 0;
    }

    .info {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      background: var(--panel-2);
      border-radius: 18px;
      padding: 12px;
      margin: 10px auto;
      width: fit-content;
      max-width: 100%;
    }

    .info span {
      color: #e7fbff;
      font-size: 15px;
      white-space: nowrap;
    }

    .datetime {
      text-align: center;
      color: var(--blue);
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 700;
      margin-top: 16px;
    }

    .status {
      min-height: 22px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      margin-top: 8px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 620px) {
      .app {
        border-radius: 20px;
      }

      .panel {
        width: 100%;
      }

      button {
        min-width: 76px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="row panel">
      <span id="soundLabel">音声：標準ベル</span>
      <button id="soundButton" type="button">♪</button>
      <input id="soundFileInput" class="hidden" type="file" accept="audio/*">
    </div>

    <div id="modeLabel" class="mode">作業中</div>

    <div class="moon-wrap" aria-hidden="true">
      <svg viewBox="0 0 190 190">
        <defs>
          <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur">
            </feGaussianBlur>
            <feMerge>
              <feMergeNode in="blur"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
        </defs>
        <circle cx="95" cy="95" r="72" fill="#091d3b" stroke="#2b5c8e" stroke-width="16"></circle>
        <circle id="moonTrack" cx="95" cy="95" r="72" fill="none" stroke="#8c7ae6" stroke-width="16" stroke-linecap="round" filter="url(#glow)" transform="rotate(-90 95 95)"></circle>
        <circle cx="95" cy="95" r="45" fill="#dff7ff" opacity="0.92"></circle>
        <circle id="moonShade" cx="112" cy="95" r="45" fill="#0b2142" opacity="0.72"></circle>
      </svg>
    </div>

    <div id="timeLabel" class="time">25:00</div>

    <div class="row panel">
      <label for="taskName">作業名</label>
      <input id="taskName" list="taskNameList" autocomplete="off">
      <datalist id="taskNameList"></datalist>
    </div>

    <div class="row panel">
      <label for="workMinutes">作業分</label>
      <input id="workMinutes" type="number" min="1" step="1">
      <label for="breakMinutes">休憩分</label>
      <input id="breakMinutes" type="number" min="1" step="1">
      <button id="applyButton" type="button">時間を反映</button>
    </div>

    <div class="row panel">
      <span id="dataFileLabel">データ：未選択</span>
      <button id="chooseDataButton" type="button">データを選択</button>
      <button id="importDataButton" class="start" type="button">読み込み</button>
      <button id="exportDataButton" class="export" type="button">出力</button>
      <input id="dataFileInput" class="hidden" type="file" accept=".csv,text/csv">
    </div>

    <div class="row">
      <button id="startButton" class="icon-button start" type="button" aria-label="開始">▶</button>
      <button id="pauseButton" class="icon-button pause" type="button" aria-label="一時停止">⏸</button>
      <button id="resetButton" class="icon-button reset" type="button" aria-label="記録してリセット">■</button>
    </div>

    <div class="info">
      <span id="countLabel">作業回数：0回</span>
      <span id="totalLabel">今日の作業時間：0分</span>
    </div>

    <div id="dateTimeLabel" class="datetime"></div>
    <div id="statusLabel" class="status"></div>
  </main>

  <script>
    const STORAGE_KEY = "pomodoroTimerV204Data";
    const FIELDNAMES = [
      "record_type",
      "key",
      "value",
      "date",
      "task_name",
      "start_time",
      "end_time",
      "work_count",
      "total_minutes",
      "total_seconds",
      "work_minutes",
      "work_seconds",
      "updated_at"
    ];

    const state = loadState();
    let mode = "work";
    let totalSeconds = state.settings.work_minutes * 60;
    let remainingSeconds = totalSeconds;
    let running = false;
    let lastTick = 0;
    let currentWorkStartTime = null;
    let selectedDataFile = null;
    let selectedSoundUrl = null;
    let animationCount = 0;

    const audio = new Audio();
    const els = {
      soundLabel: document.getElementById("soundLabel"),
      soundButton: document.getElementById("soundButton"),
      soundFileInput: document.getElementById("soundFileInput"),
      modeLabel: document.getElementById("modeLabel"),
      moonTrack: document.getElementById("moonTrack"),
      moonShade: document.getElementById("moonShade"),
      timeLabel: document.getElementById("timeLabel"),
      taskName: document.getElementById("taskName"),
      taskNameList: document.getElementById("taskNameList"),
      workMinutes: document.getElementById("workMinutes"),
      breakMinutes: document.getElementById("breakMinutes"),
      applyButton: document.getElementById("applyButton"),
      dataFileLabel: document.getElementById("dataFileLabel"),
      chooseDataButton: document.getElementById("chooseDataButton"),
      importDataButton: document.getElementById("importDataButton"),
      exportDataButton: document.getElementById("exportDataButton"),
      dataFileInput: document.getElementById("dataFileInput"),
      startButton: document.getElementById("startButton"),
      pauseButton: document.getElementById("pauseButton"),
      resetButton: document.getElementById("resetButton"),
      countLabel: document.getElementById("countLabel"),
      totalLabel: document.getElementById("totalLabel"),
      dateTimeLabel: document.getElementById("dateTimeLabel"),
      statusLabel: document.getElementById("statusLabel")
    };

    function loadState() {
      const defaults = {
        settings: {
          work_minutes: 25,
          break_minutes: 5,
          last_task_name: ""
        },
        taskNames: [],
        daily: {},
        details: []
      };

      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) return defaults;
        return {
          settings: { ...defaults.settings, ...(saved.settings || {}) },
          taskNames: Array.isArray(saved.taskNames) ? saved.taskNames : [],
          daily: saved.daily || {},
          details: Array.isArray(saved.details) ? saved.details : []
        };
      } catch {
        return defaults;
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function todayKey() {
      return formatDate(new Date());
    }

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function formatDate(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function formatDateTime(date) {
      return `${formatDate(date)} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function formatTimer(seconds) {
      const minutes = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${pad(minutes)}:${pad(secs)}`;
    }

    function updateDisplay() {
      els.timeLabel.textContent = formatTimer(remainingSeconds);

      const daily = state.daily[todayKey()] || {
        work_count: 0,
        total_seconds: 0
      };
      els.countLabel.textContent = `作業回数：${Number(daily.work_count || 0)}回`;
      els.totalLabel.textContent = `今日の作業時間：${Math.floor(Number(daily.total_seconds || 0) / 60)}分`;

      const progress = totalSeconds > 0 ? (totalSeconds - remainingSeconds) / totalSeconds : 0;
      const circumference = 2 * Math.PI * 72;
      els.moonTrack.style.strokeDasharray = `${circumference}`;
      els.moonTrack.style.strokeDashoffset = `${circumference * (1 - progress)}`;
      els.moonTrack.style.stroke = mode === "work" ? "#8c7ae6" : "#1fc7a1";
      els.moonShade.setAttribute("cx", String(140 - progress * 90));
    }

    function updateTaskList() {
      els.taskNameList.innerHTML = "";
      for (const name of state.taskNames) {
        const option = document.createElement("option");
        option.value = name;
        els.taskNameList.appendChild(option);
      }
    }

    function rememberTaskName(taskName) {
      const name = taskName.trim();
      if (!name) return;
      state.taskNames = [name, ...state.taskNames.filter((item) => item !== name)].slice(0, 30);
      state.settings.last_task_name = name;
      updateTaskList();
      saveState();
    }

    function applyMinutes() {
      const work = Math.max(1, Number.parseInt(els.workMinutes.value, 10) || 25);
      const rest = Math.max(1, Number.parseInt(els.breakMinutes.value, 10) || 5);
      state.settings.work_minutes = work;
      state.settings.break_minutes = rest;
      saveState();
      if (!running) resetWithoutRecording();
      setStatus("時間を反映しました");
    }

    function startTimer() {
      stopSound();
      if (running) return;

      if (mode === "work" && currentWorkStartTime === null) {
        currentWorkStartTime = new Date();
      }

      rememberTaskName(els.taskName.value);
      running = true;
      lastTick = Date.now();
      setStatus("");
      tick();
    }

    function pauseTimer() {
      stopSound();
      running = false;
    }

    function resetTimer() {
      stopSound();
      if (mode === "work") {
        const workedSeconds = totalSeconds - remainingSeconds;
        if (workedSeconds > 0) recordWorkSession(workedSeconds);
      }
      running = false;
      currentWorkStartTime = null;
      mode = "work";
      totalSeconds = state.settings.work_minutes * 60;
      remainingSeconds = totalSeconds;
      updateDisplay();
      setStatus("作業時間を記録して初期値に戻しました");
    }

    function resetWithoutRecording() {
      running = false;
      currentWorkStartTime = null;
      mode = "work";
      totalSeconds = state.settings.work_minutes * 60;
      remainingSeconds = totalSeconds;
      updateDisplay();
    }

    function tick() {
      if (!running) return;

      const now = Date.now();
      const elapsed = Math.floor((now - lastTick) / 1000);
      if (elapsed >= 1) {
        remainingSeconds -= elapsed;
        lastTick = now;

        if (remainingSeconds <= 0) {
          remainingSeconds = 0;
          running = false;
          updateDisplay();
          playSound();
          switchMode();
          return;
        }

        updateDisplay();
      }

      window.setTimeout(tick, 200);
    }

    function switchMode() {
      if (mode === "work") {
        recordWorkSession(state.settings.work_minutes * 60);
        mode = "break";
        totalSeconds = state.settings.break_minutes * 60;
      } else {
        mode = "work";
        totalSeconds = state.settings.work_minutes * 60;
      }
      remainingSeconds = totalSeconds;
      updateDisplay();
    }

    function recordWorkSession(workedSeconds) {
      const end = new Date();
      const start = currentWorkStartTime || end;
      const date = formatDate(end);
      const taskName = els.taskName.value.trim();
      rememberTaskName(taskName);

      const current = state.daily[date] || {
        date,
        work_count: 0,
        total_minutes: 0,
        total_seconds: 0,
        updated_at: ""
      };

      current.work_count = Number(current.work_count || 0) + 1;
      current.total_seconds = Number(current.total_seconds || 0) + workedSeconds;
      current.total_minutes = Math.floor(current.total_seconds / 60);
      current.updated_at = formatDateTime(end);
      state.daily[date] = current;

      state.details.push({
        date,
        task_name: taskName,
        start_time: formatDateTime(start),
        end_time: formatDateTime(end),
        work_minutes: Math.floor(workedSeconds / 60),
        work_seconds: workedSeconds
      });

      currentWorkStartTime = null;
      saveState();
      updateDisplay();
    }

    function handleSoundButton() {
      if (!selectedSoundUrl) {
        els.soundFileInput.click();
      } else if (audio.paused) {
        playSound();
      } else {
        stopSound();
      }
    }

    function playSound() {
      if (!selectedSoundUrl) {
        window.navigator.vibrate?.(180);
        return;
      }
      audio.currentTime = 0;
      audio.play().catch(() => setStatus("音声を再生できませんでした"));
    }

    function stopSound() {
      audio.pause();
      audio.currentTime = 0;
    }

    function chooseDataFile() {
      els.dataFileInput.click();
    }

    function importSelectedData() {
      if (!selectedDataFile) {
        chooseDataFile();
        return;
      }

      selectedDataFile.text().then((text) => {
        const rows = parseCsv(text);
        if (!rows.some((row) => row.record_type)) {
          setStatus("Web版・Windows版共通のCSVを選んでください");
          return;
        }
        applyImportedRows(rows);
        resetWithoutRecording();
        setStatus(`読み込み完了：${selectedDataFile.name}`);
      }).catch(() => setStatus("CSVを読み込めませんでした"));
    }

    function applyImportedRows(rows) {
      const settings = {};
      const importedTaskNames = [];
      const importedDaily = {};
      const importedDetails = [];

      for (const row of rows) {
        if (row.record_type === "setting") {
          settings[row.key] = row.value || "";
        } else if (row.record_type === "task_name") {
          const name = (row.value || row.key || "").trim();
          if (name) importedTaskNames.push(name);
        } else if (row.record_type === "daily" && row.date) {
          importedDaily[row.date] = {
            date: row.date,
            work_count: Number(row.work_count || 0),
            total_minutes: Number(row.total_minutes || 0),
            total_seconds: Number(row.total_seconds || 0),
            updated_at: row.updated_at || ""
          };
        } else if (row.record_type === "detail" && row.date) {
          importedDetails.push({
            date: row.date || "",
            task_name: row.task_name || "",
            start_time: row.start_time || "",
            end_time: row.end_time || "",
            work_minutes: Number(row.work_minutes || 0),
            work_seconds: Number(row.work_seconds || 0)
          });
        }
      }

      if (settings.work_minutes) state.settings.work_minutes = Math.max(1, Number.parseInt(settings.work_minutes, 10) || 25);
      if (settings.break_minutes) state.settings.break_minutes = Math.max(1, Number.parseInt(settings.break_minutes, 10) || 5);
      if (settings.last_task_name) state.settings.last_task_name = settings.last_task_name;

      for (const [date, row] of Object.entries(importedDaily)) {
        state.daily[date] = row;
      }

      const seenDetails = new Set(state.details.map(detailKey));
      for (const detail of importedDetails) {
        const key = detailKey(detail);
        if (!seenDetails.has(key)) {
          state.details.push(detail);
          seenDetails.add(key);
        }
      }

      const names = [state.settings.last_task_name, ...importedTaskNames, ...state.taskNames];
      const seenNames = new Set();
      state.taskNames = names.filter((name) => {
        const clean = (name || "").trim();
        if (!clean || seenNames.has(clean)) return false;
        seenNames.add(clean);
        return true;
      }).slice(0, 30);

      hydrateControls();
      saveState();
    }

    function detailKey(detail) {
      return [
        detail.date,
        detail.task_name,
        detail.start_time,
        detail.end_time,
        detail.work_minutes,
        detail.work_seconds
      ].join("\\u0001");
    }

    function exportData() {
      const csv = makeUnifiedCsv();
      const blob = new Blob(["\\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "pomodoro_data.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      setStatus("pomodoro_data.csv を出力しました");
    }

    function makeUnifiedCsv() {
      const rows = [
        {
          record_type: "setting",
          key: "work_minutes",
          value: state.settings.work_minutes
        },
        {
          record_type: "setting",
          key: "break_minutes",
          value: state.settings.break_minutes
        },
        {
          record_type: "setting",
          key: "last_task_name",
          value: els.taskName.value.trim() || state.settings.last_task_name
        }
      ];

      for (const name of state.taskNames) {
        rows.push({
          record_type: "task_name",
          key: name,
          value: name
        });
      }

      for (const date of Object.keys(state.daily).sort()) {
        const row = state.daily[date];
        rows.push({
          record_type: "daily",
          date,
          work_count: row.work_count || 0,
          total_minutes: row.total_minutes || 0,
          total_seconds: row.total_seconds || 0,
          updated_at: row.updated_at || ""
        });
      }

      for (const row of state.details) {
        rows.push({
          record_type: "detail",
          date: row.date || "",
          task_name: row.task_name || "",
          start_time: row.start_time || "",
          end_time: row.end_time || "",
          work_minutes: row.work_minutes || 0,
          work_seconds: row.work_seconds || 0
        });
      }

      return [
        FIELDNAMES.join(","),
        ...rows.map((row) => FIELDNAMES.map((field) => csvCell(row[field] ?? "")).join(","))
      ].join("\\r\\n");
    }

    function csvCell(value) {
      const text = String(value);
      if (/[",\\r\\n]/.test(text)) {
        return `"${text.replaceAll('"', '""')}"`;
      }
      return text;
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && quoted && next === '"') {
          cell += '"';
          i += 1;
        } else if (char === '"') {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          row.push(cell);
          cell = "";
        } else if ((char === "\\n" || char === "\\r") && !quoted) {
          if (char === "\\r" && next === "\\n") i += 1;
          row.push(cell);
          if (row.some((value) => value !== "")) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      row.push(cell);
      if (row.some((value) => value !== "")) rows.push(row);
      if (rows.length === 0) return [];

      const headers = rows.shift().map((header) => header.replace(/^\\ufeff/, ""));
      return rows.map((values) => Object.fromEntries(headers.map((header, index) => [header, values[index] || ""])));
    }

    function updateDateTime() {
      const now = new Date();
      const ampm = now.getHours() >= 12 ? "午後" : "午前";
      let hour = now.getHours() % 12;
      if (hour === 0) hour = 12;
      els.dateTimeLabel.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日　${ampm}${hour}時${pad(now.getMinutes())}分`;
    }

    function animateMode() {
      const dots = ".".repeat(animationCount % 4);
      els.modeLabel.textContent = `${mode === "work" ? "作業中" : "休憩中"}${dots}`;
      els.modeLabel.style.color = mode === "work" ? "#e7fbff" : "#76f0d2";
      animationCount += 1;
    }

    function setStatus(message) {
      els.statusLabel.textContent = message;
    }

    function hydrateControls() {
      els.workMinutes.value = state.settings.work_minutes;
      els.breakMinutes.value = state.settings.break_minutes;
      els.taskName.value = state.settings.last_task_name || "";
      updateTaskList();
      updateDisplay();
    }

    els.soundButton.addEventListener("click", handleSoundButton);
    els.soundFileInput.addEventListener("change", () => {
      const file = els.soundFileInput.files[0];
      if (!file) return;
      if (selectedSoundUrl) URL.revokeObjectURL(selectedSoundUrl);
      selectedSoundUrl = URL.createObjectURL(file);
      audio.src = selectedSoundUrl;
      els.soundLabel.textContent = `音声：${file.name}`;
    });

    els.applyButton.addEventListener("click", applyMinutes);
    els.chooseDataButton.addEventListener("click", chooseDataFile);
    els.importDataButton.addEventListener("click", importSelectedData);
    els.exportDataButton.addEventListener("click", exportData);
    els.dataFileInput.addEventListener("change", () => {
      selectedDataFile = els.dataFileInput.files[0] || null;
      if (selectedDataFile) {
        els.dataFileLabel.textContent = `データ：${selectedDataFile.name}`;
      }
    });

    els.startButton.addEventListener("click", startTimer);
    els.pauseButton.addEventListener("click", pauseTimer);
    els.resetButton.addEventListener("click", resetTimer);
    els.taskName.addEventListener("change", () => {
      state.settings.last_task_name = els.taskName.value.trim();
      rememberTaskName(state.settings.last_task_name);
    });

    hydrateControls();
    updateDateTime();
    window.setInterval(updateDateTime, 1000);
    window.setInterval(animateMode, 500);
  </script>
</body>
</html>
